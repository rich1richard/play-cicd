name: Sentinel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  BASE_URL: https://www.automationexercise.com
  USER_EMAIL: ${{ secrets.USER_EMAIL }}
  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

jobs:
  test-staging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/cache@v5
        id: cache-playwright
        with:
          path: |
            ~/.cache/ms-playwright
            C:\Users\runneradmin\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright browsers dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run tests
        run: npx playwright test test.spec.ts

      - uses: actions/upload-artifact@v6
        if: !cancelled()
        with:
          name: ${{ runner.os }}-playwright-report
          path: playwright-report/
          retention-days: 7

  test-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/cache@v5
        id: cache-playwright
        with:
          path: |
            ~/.cache/ms-playwright
            C:\Users\runneradmin\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright browsers dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run tests
        run: npx playwright test api.spec.ts --project=chromium

      - uses: actions/upload-artifact@v6
        if: !cancelled()
        with:
          name: ${{ runner.os }}-playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-production:
    needs: [test-staging, test-api]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to production
        run: echo "Deploying to production..."

      - name: Wait for deployment
        run: sleep 10

      - name: Notify deployment completed
        run: echo "Deployment completed successfully"


