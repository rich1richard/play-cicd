name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        type: choice
        required: true
        options:
        - all
        - chromium
        - firefox
        - webkit

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Install All Playwright Browsers
      if: ${{ github.event.inputs.browser == 'all' }}
      run: npx playwright install --with-deps
    - name: Install Selected Playwright Browser
      if: ${{ github.event.inputs.browser != 'all' }}
      run: npx playwright install ${{ github.event.inputs.browser || 'chromium' }} --with-deps

    - name: Run Playwright tests on all browsers
      if: ${{ github.event.inputs.browser == 'all' }}
      run: npx playwright test
    - name: Run Playwright tests on selected browser
      if: ${{ github.event.inputs.browser != 'all' }}
      run: npx playwright test --project=${{ github.event.inputs.browser || 'chromium' }}

    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
